name: Deploy Website and Client Config

on:
  push:
    branches:
      - main
    paths:
      - client-config.env
      - .github/workflows/deploy.yml

  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout s3work
        uses: actions/checkout@v4
        with:
          path: config

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: muacloud/muacloud.github.io
          path: site

      - name: Validate files
        run: |
          test -s config/client-config.env
          test -s site/index.html
          grep -q '^api_domains=' config/client-config.env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-east-1

      - name: Sync website to S3
        run: |
          aws s3 sync ./site s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "client-config.env"

      - name: Upload client config
        run: |
          aws s3 cp config/client-config.env \
            s3://${{ secrets.AWS_S3_BUCKET }}/client-config.env \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-cache, max-age=60"

      - name: Refresh CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
