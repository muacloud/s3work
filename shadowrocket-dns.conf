[General]
# Public DoH resolvers for normal domains.
dns-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query

# Keep fallback encrypted; do not fall back to system DNS.
fallback-dns-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query
dns-direct-system = false

# Force local name resolution in both Proxy and Config routing modes.
always-ip-address = true

# Apply the Host DNS assignment to proxied connections too.
use-local-host-item-for-proxy = true

[Host]
# Always resolve this domain with the dedicated AliDNS DoH endpoint.
snejsat.baidu.com = server:https://874711-8pxv27wt3mhig10r.alidns.com/dns-query

[Rule]
# Add existing routing rules above this line if needed.
FINAL,PROXY
